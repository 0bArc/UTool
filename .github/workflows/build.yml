name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build solution
        run: dotnet build utool.sln -c Release --nologo
      - name: Publish utool
        run: dotnet run --project build.csproj -c Release
      - name: Smoke test CLI
        run: dist\utool\utool.exe help
